<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>차곡 · 전체 UI 점검</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f4f2;color:#16291f;font:17px/1.6 system-ui,sans-serif}header{padding:26px 32px;background:#fff;border-bottom:1px solid #d8e1db}h1{font-size:30px;margin:0 0 6px}p{margin:6px 0}a{color:#087457}main{display:grid;grid-template-columns:240px 1fr;gap:28px;padding:28px}nav{display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 210px);overflow:auto;position:sticky;top:20px}button,select{font:inherit;border:1px solid #d8e1db;border-radius:12px;padding:10px 14px;color:inherit;background:#fff;cursor:pointer}nav button{text-align:left}nav button[aria-current=true]{background:#087457;color:white}section{min-width:0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}h2{margin:0;font-size:26px}.images{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;align-items:start}figure{margin:0;background:#fff;padding:16px;border:1px solid #d8e1db;border-radius:16px;min-width:0}figcaption{font-weight:650;margin-bottom:12px}img{display:block;width:100%;height:auto;max-width:841px;margin:auto;border:1px solid #e7ede9}img.narrow{max-width:320px}.caption{font-size:14px;color:#52675b}.note{color:#52675b;max-width:840px}@media(max-width:850px){main{display:block;padding:16px}nav{position:static;max-height:190px;display:grid;grid-template-columns:1fr 1fr;margin-bottom:24px}header{padding:20px}}
</style><header><h1>차곡 · 전체 UI 점검</h1><p>주행 화면이 기본 · 차량 일지는 정차 시 여는 보조 화면</p><p class="caption">모형 이미지가 아닌 Android 네이티브 화면입니다. 화면 크기별 캡처와 실제 PLEOS 분할 화면 검증을 구분해 보관합니다. 데이터는 테스트용입니다.</p><a href="ui-review.txt">점검·테스트 결과</a> · <a href="android-evidence/native-parked-pages.mp4">실제 분할 화면 녹화</a></header><main><nav id="nav" aria-label="점검한 화면"></nav><section><h2 id="title"></h2><p id="note" class="note"></p><div class="toolbar"><select id="mode" aria-label="비교 방식"><option value="compare">수정 전후</option><option value="after">수정 후</option><option value="before">수정 전</option></select><select id="size" aria-label="화면 크기"><option value="841">옆 창 · 841dp</option><option value="320">좁은 창 · 320dp</option><option value="full">전체 스크롤 내용</option></select></div><div class="images" id="images"></div></section></main><script>
const items=[{"id": "summary", "title": "차량 요약", "note": "중요한 관리와 이번 달 지출을 먼저 보여주고 최근 기록을 한 목록으로 정리했습니다.", "kind": "page"}, {"id": "diary", "title": "차량 일지", "note": "날짜·항목·비용을 구분하고 월별 필터와 수정 진입을 유지했습니다.", "kind": "page"}, {"id": "detail", "title": "기록 상세", "note": "비용, 주행거리, 출처, 메모를 구분했습니다.", "kind": "page"}, {"id": "maintenance", "title": "소모품 관리", "note": "다음 관리 거리와 날짜에 고정된 항목 이름을 붙였습니다.", "kind": "page"}, {"id": "statistics", "title": "비용 통계", "note": "비용을 크게 표시하고 6개월 그래프를 넓혔습니다. 좁은 창에서는 그래프를 가로로 스크롤합니다.", "kind": "page"}, {"id": "more", "title": "더보기", "note": "차량·사용자 설정과 기록 활용 기능을 묶고 아이콘을 통일했습니다.", "kind": "page"}, {"id": "input", "title": "기록 추가", "note": "음성과 직접 입력을 구분하고 사용자가 읽을 필요가 없는 백엔드 표기를 제거했습니다.", "kind": "page"}, {"id": "draft", "title": "초안 확인", "note": "입력된 숫자에도 주행거리와 비용 이름이 남도록 했습니다. 확인·저장 흐름은 유지합니다.", "kind": "page"}, {"id": "inbox", "title": "확인할 기록", "note": "작성 중인 기록과 감지 후보를 먼저 보여줍니다.", "kind": "page"}, {"id": "learning", "title": "관리 도감", "note": "학습 진행 카드를 줄여 실제 학습 내용과 선택지를 먼저 볼 수 있게 했습니다.", "kind": "page"}, {"id": "edit", "title": "기록 수정", "note": "실제 Android 화면에서 캡처했습니다.", "kind": "dialog"}, {"id": "date-picker", "title": "날짜 선택", "note": "실제 Android 화면에서 캡처했습니다.", "kind": "dialog"}, {"id": "cancel-confirm", "title": "기록 취소 확인", "note": "실제 Android 화면에서 캡처했습니다.", "kind": "dialog"}, {"id": "maintenance-actions", "title": "관리 설정 메뉴", "note": "실제 Android 화면에서 캡처했습니다.", "kind": "dialog"}, {"id": "interval", "title": "주기 설정", "note": "실제 Android 화면에서 캡처했습니다.", "kind": "dialog"}, {"id": "vehicle", "title": "차량 설정", "note": "실제 Android 화면에서 캡처했습니다.", "kind": "dialog"}, {"id": "user", "title": "사용자 전환", "note": "실제 Android 화면에서 캡처했습니다.", "kind": "dialog"}, {"id": "sharing", "title": "공유 범위", "note": "실제 Android 화면에서 캡처했습니다.", "kind": "dialog"}, {"id": "item-picker", "title": "정비 항목 선택", "note": "실제 Android 화면에서 캡처했습니다.", "kind": "dialog"}, {"id": "report-range", "title": "리포트 범위", "note": "실제 Android 화면에서 캡처했습니다.", "kind": "dialog"}, {"id": "report-preview", "title": "리포트 미리보기", "note": "실제 Android 화면에서 캡처했습니다.", "kind": "dialog"}, {"id": "reports", "title": "저장한 리포트", "note": "실제 Android 화면에서 캡처했습니다.", "kind": "dialog"}, {"id": "saved-report-detail", "title": "저장한 리포트 내용", "note": "실제 Android 화면에서 캡처했습니다.", "kind": "dialog"}, {"id": "collection", "title": "만난 친구들", "note": "실제 Android 화면에서 캡처했습니다.", "kind": "dialog"}, {"id": "companion-menu", "title": "주행 화면 메뉴", "note": "실제 Android 화면에서 캡처했습니다.", "kind": "dialog"}, {"id": "skins", "title": "스킨 선택", "note": "실제 Android 화면에서 캡처했습니다.", "kind": "dialog"}, {"id": "empty-summary", "title": "빈 요약", "note": "기록이 없는 상태와 야간 대비도 별도로 확인합니다.", "kind": "page"}, {"id": "empty-diary", "title": "빈 일지", "note": "기록이 없는 상태와 야간 대비도 별도로 확인합니다.", "kind": "page"}, {"id": "empty-statistics", "title": "빈 통계", "note": "기록이 없는 상태와 야간 대비도 별도로 확인합니다.", "kind": "page"}, {"id": "night-statistics", "title": "야간 통계", "note": "기록이 없는 상태와 야간 대비도 별도로 확인합니다.", "kind": "page"}, {"id": "night-more", "title": "야간 더보기", "note": "기록이 없는 상태와 야간 대비도 별도로 확인합니다.", "kind": "page"}, {"id": "night-input", "title": "야간 입력", "note": "기록이 없는 상태와 야간 대비도 별도로 확인합니다.", "kind": "page"}, {"id": "driving-racer", "title": "주행 · 네온 레이서", "note": "기존 일러스트와 주행 연출을 유지하고 글꼴을 맞췄습니다. 비·질문 상태의 실제 Android 장면입니다.", "kind": "scene"}, {"id": "driving-hyundai", "title": "주행 · 현대 세단", "note": "기존 일러스트와 주행 연출을 유지하고 글꼴을 맞췄습니다. 비·질문 상태의 실제 Android 장면입니다.", "kind": "scene"}];let selected=items[0];const nav=document.querySelector('#nav');
items.forEach(item=>{const b=document.createElement('button');b.textContent=item.title;b.dataset.id=item.id;b.onclick=()=>{selected=item;render()};nav.append(b)});
function render(){document.querySelector('#title').textContent=selected.title;document.querySelector('#note').textContent=selected.note;nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',b.dataset.id===selected.id));const images=document.querySelector('#images');images.replaceChildren();const mode=document.querySelector('#mode').value,size=document.querySelector('#size').value;document.querySelector('#size').disabled=selected.kind!=='page';for(const stage of mode==='compare'?['before','after']:[mode]){const name='review-'+selected.id+(selected.kind==='page'?'-'+(stage==='before'&&size==='full'?'841':size):'')+'.png',f=document.createElement('figure'),c=document.createElement('figcaption'),im=document.createElement('img');c.textContent=stage==='before'?'수정 전':'수정 후';im.src=stage+'/'+name;im.alt=selected.title+' '+c.textContent;if((size==='320'&&selected.kind==='page')||selected.kind==='scene')im.className='narrow';im.onerror=()=>{im.remove();const p=document.createElement('p');p.textContent='이 상태는 수정 후 추가 검증한 화면입니다.';f.append(p)};f.append(c,im);images.append(f)}}document.querySelectorAll('select').forEach(s=>s.onchange=render);render();
</script></html>
